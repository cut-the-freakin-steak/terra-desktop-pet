[package]
name = "bevy_temp"
version = "0.1.0"
edition = "2024"
description = "a template for bevy projects"
readme = "README.md"
repository = "https://codeberg.org/cut-the-freakin-steak/terra-desktop-pet"
license = "MIT"

[dependencies]
bevy = { version = "0.20.0", features = ["dynamic_linking", "hotpatching"] }
bevy_dylib = "0.20.0"

[dependencies.log]
version = "0.4.34"
features = ["max_level_debug", "release_max_level_warn"]

[lints.clippy]
needless_return = "allow"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# do a second optimization pass over the entire program, including dependencies
lto = "thin"

# compile the entire crate as one unit
# slows compile times, marginal improvements
codegen-units = 1

# optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web
[profile.wasm-release]
inherits = "release"
strip = "debuginfo"

# optimize with size in mind (also try "z", sometimes it is better)
opt-level = "s"
