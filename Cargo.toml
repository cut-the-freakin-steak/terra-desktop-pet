[package]
name = "jAkEtop"
version = "0.1.0"
edition = "2024"
description = "silly little desktop jake"
readme = "README.md"
repository = "https://codeberg.org/cut-the-freakin-steak/terra-desktop-pet"
license = "MIT"

[package.metadata.packager]
product-name = "jAkEtop"
identifier = "com.steaknmillie.jAkEtop"
version = "0.1.0"
formats = ["app"]
icons = ["assets/jAkE_app_icon.png"]

[dependencies]
bevy = "0.20.0"
log = { version = "0.4.34", features = ["max_level_debug", "release_max_level_warn"] }

[features]
bevy_debug = ["bevy/dynamic_linking", "bevy/hotpatching"]

[lints.clippy]
needless_return = "allow"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# do a second optimization pass over the entire program, including dependencies
lto = "thin"

# compile the entire crate as one unit
# slows compile times, marginal improvements
codegen-units = 1

# optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web
[profile.wasm-release]
inherits = "release"
strip = "debuginfo"

# optimize with size in mind (also try "z", sometimes it is better)
opt-level = "s"
