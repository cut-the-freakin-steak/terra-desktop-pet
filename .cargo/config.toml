# !! THIS CONFIG REQUIRES NIGHTLY RUST AND CRANELIFT INSTALLED !!
# `rustup default nightly`
# `rustup component add rustc-codegen-cranelift-preview --toolchain nightly`

# cranelift is unstable
[profile.dev]
debug = "line-tables-only"
codegen-backend = "cranelift"

# crates compile with llvm still, cranelift is simply for debug speed
[profile.dev.package."*"]
codegen-backend = "llvm"

# frontend threads are heeere yayy
# macos don't need no external linker
[target."cfg(all())"]
rustflags = [
  "-Zshare-generics=y",
  "-Zcache-proc-macros",
  "-Zunstable-options",
  "--jobs-frontend=8",

  # some bs is happening rn, silece.
  "-Cunsafe-allow-abi-mismatch=target-feature",
]
rustdocflags = ["-Zunstable-options", "--jobs-frontend=8"]

# mold isnt available on windows, so use lld
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = [
  "-Zshare-generics=n",
  "-Zunstable-options",
  "--jobs-linker=8",
]

# for using mold as the linker on linux:
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=mold"]

# when she codegen on yo backend
[unstable]
codegen-backend = true
