name: Warm Cargo Caches

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - rust-toolchain
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/cache-warm.yml

  workflow_dispatch:

  schedule:
    # weekly, sunday at 09:00 UTC.
    - cron: "0 9 * * 0"

jobs:
  warm:
    name: Warm Cache ~ ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - name: windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc

          - name: macos (arm64)
            os: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            clang \
            mold \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-27
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        id: cargo-cache
        uses: Swatinem/rust-cache@v2
        with:
          # stable across workflows and jobs, but separate per platform/target.
          shared-key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}

          # prevent the automatic job ID from making the key job-specific.
          add-job-id-key: false

          # cache cargo-installed tools and their build artifacts.
          cache-all-crates: true

          # cache dependency build artifacts under target/.
          cache-targets: true

          # keep the cache even if a later build step fails.
          cache-on-failure: true

          # cache ~/.cargo/bin
          cache-bin: true

          # this workflow is specifically allowed to create/update caches.
          save-if: true

      - name: Install cargo-packager
        if: runner.os == 'macOS'
        shell: bash
        run: cargo install cargo-packager --locked

      - name: Build
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Report cache result
        run: |
          echo "Cache hit: ${{ steps.cargo-cache.outputs.cache-hit }}"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          echo "Rust target: ${{ matrix.target }}"
