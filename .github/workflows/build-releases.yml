name: Build Releases

env:
  APP_NAME: "jAkEtop"

on:
  push:
    tags:
      - "v*" # triggers automatically a version tag is pushed (git tag v1.0.0 && git push --tags)

jobs:
  build:
    name: Build (${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            command: cargo build --release --target x86_64-unknown-linux-gnu

          - name: windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            command: cargo build --release --target x86_64-pc-windows-msvc

          - name: macos (arm64)
            os: macos-14
            target: aarch64-apple-darwin
            command: cargo build --release --target aarch64-apple-darwin && cargo packager --release --target aarch64-apple-darwin

    steps:
      # pull repo code into the vm
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            clang \
            mold \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0

      # install the correct rust toolchain and target architecture
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-27
          targets: ${{ matrix.target }}

      # caching
      - name: Cache Cargo Dependencies
        id: cargo-cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-all-crates: true
          cache-bin: true
          cache-on-failure: false
          save-if: false

          shared-key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}
          add-job-id-key: false

      - name: Report Cache Result
        run: |
          echo "Cargo cache hit: ${{ steps.cargo-cache.outputs.cache-hit }}"

      # install cargo-packager on the mac runners (since they handle packaging)
      - name: Install cargo-packager
        if: startsWith(matrix.os, 'macos')
        run: cargo install cargo-packager --locked

      # execute build command
      - name: Run Build Command
        run: ${{ matrix.command }}

      # save the compiled binaries/installers as downloadable build artifacts
      - name: Prepare Artifact
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact

          if [ "${{ matrix.os }}" = "macos-14" ]; then
            # cargo-packager should have produced an app bundle here.
            cp -R "target/${{ matrix.target }}/release/${{ env.APP_NAME }}.app" artifact/
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/${{ env.APP_NAME }}.exe" artifact/
          else
            cp "target/${{ matrix.target }}/release/${{ env.APP_NAME }}" artifact/
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }} ~ ${{ matrix.name }}
          path: artifact/
          if-no-files-found: error
