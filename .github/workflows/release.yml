name: Build Releases

on:
  push:
    tags:
      - "v*" # triggers automatically a version tag is pushed (git tag v1.0.0 && git push --tags)

jobs:
  build:
    name: Build (${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            command: cargo build --release --no-default-features --target x86_64-unknown-linux-gnu

          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            command: cargo build --release --no-default-features --target x86_64-pc-windows-msvc

          - name: macOS Apple Silicon (ARM64)
            os: macos-14
            target: aarch64-apple-darwin
            command: cargo packager --release --no-default-features --target aarch64-apple-darwin --format app

          - name: macOS Intel (x86_64)
            os: macos-13
            target: x86_64-apple-darwin
            command: cargo packager --release --no-default-features --target x86_64-apple-darwin --format app

    steps:
      # pull repo code into the vm
      - name: Checkout Code
        uses: actions/checkout@v4

      # install the correct rust toolchain and target architecture
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      # caching
      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      # install cargo-packager on the mac runners (since they handle packaging)
      - name: Install cargo-packager
        if: startsWith(matrix.os, 'macos')
        run: cargo install cargo-packager --locked

      # execute build command
      - name: Run Build Command
        run: ${{ matrix.command }}

      # save the compiled binaries/installers as downloadable build artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/
            target/packager/
